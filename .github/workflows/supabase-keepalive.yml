name: Supabase keep-alive

# Evita che il progetto Supabase (piano gratuito) venga messo in pausa
# dopo 7 giorni senza attività: ogni 3 giorni esegue una lettura minima
# sul database tramite l'API REST pubblica.
# Costo stimato: circa 10 minuti di GitHub Actions al mese.
# Nota: i workflow pianificati partono solo dal branch predefinito (main).

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC, ogni 3 giorni
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout configurazione client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: js/supabase_config.js
          sparse-checkout-cone-mode: false

      - name: Lettura minima sul database
        env:
          # Facoltativi: se impostati come secret del repo hanno la precedenza
          # sui valori pubblici presenti in js/supabase_config.js.
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          CFG=js/supabase_config.js
          if [ -z "${SB_URL:-}" ]; then
            SB_URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" "$CFG" | head -1)
          fi
          if [ -z "${SB_KEY:-}" ]; then
            SB_KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" "$CFG" | head -1)
          fi
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::URL o anon key Supabase non trovati"
            exit 1
          fi
          CODE=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/progetti?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Risposta Supabase: HTTP $CODE"
          case "$CODE" in
            2??) echo "Database attivo." ;;
            *) echo "::error::Ping Supabase fallito (HTTP $CODE)"; exit 1 ;;
          esac
