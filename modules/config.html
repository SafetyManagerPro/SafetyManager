<!-- modules/config.html -->
<div id="view-config" class="w-full max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200 mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter">Setup Progetto & Corsista</h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Configurazione Dati e Storage</p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.mostraArchivio()" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-4 py-2 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-2">
                <i data-lucide="database" class="w-4 h-4"></i> Apri DB Cloud
            </button>
            <button onclick="window.salvaCorsistaDB()" id="btn-save-cloud" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm transition-colors">
                <i data-lucide="cloud-upload" class="w-5 h-5"></i> Salva su DB
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- COLONNA 1 -->
        <div class="space-y-6">
            <div class="bg-slate-50 p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-2 mb-3"><i data-lucide="building-2" class="w-4 h-4 text-blue-600"></i> Ente Formatore</h3>
                <div class="space-y-3">
                    <input type="text" id="cfg-ente" onchange="window.updateAll()" value="CNA Imprenditori Avellino" class="input-field font-semibold text-blue-900" placeholder="Ragione Sociale">
                    <input type="text" id="cfg-ente-indirizzo" onchange="window.updateAll()" value="Via Serafino Soldi, 11/13 - 83100 Avellino" class="input-field text-xs" placeholder="Indirizzo Sede">
                    <input type="text" id="cfg-ente-contatti" onchange="window.updateAll()" value="P.IVA 02851400644 | cna.avellino@pec.it" class="input-field text-xs" placeholder="Contatti">
                    <input type="text" id="cfg-luogo-emissione" onchange="window.updateAll()" value="Avellino" class="input-field text-xs" placeholder="Luogo Emissione">
                    <div class="border-t border-slate-200 pt-2 mt-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Legale Rappresentante</label>
                        <input type="text" id="cfg-legale-nome" onchange="window.updateAll()" placeholder="Nome e Cognome" value="Mario Bianchi" class="input-field text-xs mt-1">
                        <input type="text" id="cfg-legale-nascita" onchange="window.updateAll()" placeholder="Luogo e data di nascita" class="input-field text-xs mt-1">
                    </div>
                </div>
            </div>

            <div class="bg-emerald-50 p-5 rounded-xl shadow-sm border border-emerald-200">
                <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2 border-b border-emerald-200 pb-2"><i data-lucide="graduation-cap" class="w-4 h-4 text-emerald-600"></i> Docenza</h3>
                <div class="space-y-3">
                    <select id="cfg-req-docente" onchange="window.updateAll()" class="input-field font-semibold text-xs">
                        <option value="Formatore Qualificato (D.I. 6/3/2013)">Formatore Qualificato (D.I. 6/3/2013)</option>
                        <option value="Datore di Lavoro / RSPP (Art. 34 D.Lgs 81/08)">Datore di Lavoro / RSPP (Art. 34 D.Lgs 81/08)</option>
                    </select>
                    <input type="text" id="cfg-docente" onchange="window.cambioCorso()" placeholder="Docente Principale" value="Mario Rossi" class="input-field text-xs font-bold text-emerald-800 bg-white">
                    <input type="text" id="cfg-resp-corso" onchange="window.updateAll()" placeholder="Resp. Corso" value="Mario Bianchi" class="input-field text-xs">
                    <input type="text" id="cfg-resp-progetto" onchange="window.updateAll()" placeholder="Resp. Progetto" value="Berardino Pesce" class="input-field text-xs">
                    <div id="ud-docenti-container" class="mt-4 border-t border-emerald-200 pt-3"></div>
                </div>
            </div>
        </div>

        <!-- COLONNA 2 E 3 COMBINATE -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Commessa & Pianificazione -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2 border-b pb-2"><i data-lucide="briefcase" class="w-4 h-4 text-blue-600"></i> Commessa & Pianificazione</h3>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input type="text" id="cfg-azienda" oninput="window.updateAll()" placeholder="Azienda Committente" class="input-field font-semibold text-blue-900 bg-blue-50">
                    <input type="text" id="cfg-ateco" oninput="window.updateAll()" placeholder="Codice ATECO" class="input-field text-xs font-mono">
                </div>
                
                <select id="cfg-corso" onchange="window.cambioCorso()" class="input-field font-semibold text-sm mb-4 bg-slate-50">
                    <option value="lav_basso">Formazione Lavoratori - Rischio Basso (8h)</option>
                    <option value="lav_medio">Formazione Lavoratori - Rischio Medio (12h)</option>
                    <option value="lav_alto">Formazione Lavoratori - Rischio Alto (16h)</option>
                    <option value="dl_base">Datore di Lavoro - Corso Base Universale (16h)</option>
                    <option value="preposto">Preposto Vigilanza Attiva (12h)</option>
                    <option value="dirigente">Dirigente Sicurezza (12h)</option>
                    <!-- Aggiungi qui gli altri corsi se necessari -->
                </select>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Data Inizio</label>
                        <input type="date" id="cfg-data-inizio" onchange="window.cambiaDataInizio()" class="input-field text-sm font-bold border-emerald-300">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Data Esame</label>
                        <input type="date" id="cfg-data-esame" onchange="window.updateAll()" class="input-field text-sm font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Sede</label>
                        <input type="text" id="cfg-sede-corso" oninput="window.updateAll()" placeholder="Sede Corso" class="input-field text-sm">
                    </div>
                </div>
            </div>

            <!-- Dati Corsista -->
            <div class="bg-blue-50 p-5 rounded-xl shadow-sm border border-blue-200">
                <div class="flex justify-between items-center border-b border-blue-200 pb-2 mb-4">
                    <h3 class="font-bold text-blue-900 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5"></i> Dati Corsista</h3>
                    
                    <div id="box-select-corsista" class="flex gap-2 items-center hidden">
                        <label class="text-[10px] font-bold text-blue-800 uppercase">In Sessione:</label>
                        <select id="cfg-select-corsista" onchange="window.cambiaCorsistaSessione()" class="input-field py-1 text-xs font-bold bg-white w-48"></select>
                        <button onclick="window.pulisciCertIdCaricato()" class="bg-white text-blue-600 border border-blue-300 rounded px-2 py-1 hover:bg-blue-100" title="Nuovo Corsista"><i data-lucide="user-plus" class="w-4 h-4"></i></button>
                    </div>
                </div>
                
                <input type="hidden" id="cfg-loaded-cert-id" value="">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="cfg-nome" oninput="window.updateAll()" placeholder="Nome e Cognome Corsista" class="input-field font-bold text-lg col-span-2 shadow-inner">
                    <input type="text" id="cfg-cf" oninput="window.updateAll()" placeholder="Codice Fiscale" class="input-field font-mono uppercase">
                    <input type="text" id="cfg-nascita" oninput="window.updateAll()" placeholder="Luogo e Data di Nascita" class="input-field text-sm">
                    <input type="text" id="cfg-mansione" oninput="window.updateAll()" placeholder="Mansione Aziendale" class="input-field text-sm col-span-2">
                </div>
            </div>

        </div>
    </div>
</div>
