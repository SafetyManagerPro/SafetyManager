<div id="view-aziende" class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter">Anagrafica Aziende Clienti</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Gestione committenti e dati di fatturazione/certificazione</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit sticky top-0">
            <h3 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-3 mb-4"><i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Nuova Azienda</h3>
            
            <form id="form-azienda" onsubmit="event.preventDefault(); window.salvaAziendaDB();" class="space-y-4">
                <input type="hidden" id="az-id" value="">
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Ragione Sociale *</label>
                    <input type="text" id="az-ragione-sociale" required class="input-field font-bold text-blue-900" placeholder="Es. ACME S.r.l.">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Partita IVA / C.F. *</label>
                    <input type="text" id="az-piva" required class="input-field font-mono uppercase" placeholder="IT01234567890">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Indirizzo Sede Legale</label>
                    <input type="text" id="az-indirizzo" class="input-field text-sm" placeholder="Via, CAP, Città, (PR)">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Codice ATECO</label>
                        <input type="text" id="az-ateco" class="input-field text-sm font-mono" placeholder="Es. 41.20.00">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Referente Formazione</label>
                        <input type="text" id="az-referente" class="input-field text-sm" placeholder="Nome Referente">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex gap-2">
                    <button type="button" onclick="window.resetFormAzienda()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold transition">Annulla</button>
                    <button type="submit" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition shadow">
                        <i data-lucide="save" class="w-4 h-4"></i> Salva Azienda
                    </button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-emerald-600"></i> Database Aziende</h3>
                <input type="text" id="search-aziende" oninput="window.filtraAziende()" placeholder="Cerca azienda..." class="px-3 py-1.5 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Ragione Sociale</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">P.IVA / C.F.</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">ATECO</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider text-center">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-aziende" class="divide-y divide-slate-100">
                        <tr><td colspan="4" class="p-6 text-center text-slate-400 italic">Caricamento in corso...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
