<div id="view-scadenze" class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter flex items-center gap-3">
                <i data-lucide="bell-ring" class="w-8 h-8 text-red-500"></i> Scadenziario Attestati
            </h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Monitoraggio scadenze, alert e rinnovi corsisti</p>
        </div>
        <button onclick="window.refreshScadenze()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-4 rounded font-bold text-xs uppercase tracking-widest transition flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Aggiorna
        </button>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 items-end">
        <div class="flex-1 w-full">
            <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Cerca Allievo, Azienda o Corso</label>
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search-scadenze" onkeyup="window.renderScadenzeTable()" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded text-sm outline-none focus:border-blue-500 transition" placeholder="Es. Mario Rossi, Edilizia SRL, RLS...">
            </div>
        </div>
        <div class="w-full md:w-64 shrink-0">
            <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Periodo Scadenza</label>
            <select id="filter-giorni" onchange="window.renderScadenzeTable()" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded text-sm outline-none focus:border-blue-500 transition font-bold text-red-700">
                <option value="30">Entro i prossimi 30 Giorni (+ Scaduti)</option>
                <option value="60">Entro i prossimi 60 Giorni (+ Scaduti)</option>
                <option value="90">Entro i prossimi 90 Giorni (+ Scaduti)</option>
                <option value="9999" class="text-slate-800">Tutti i certificati a sistema</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
            <table class="w-full text-left text-xs border-collapse">
                <thead class="bg-slate-800 text-white sticky top-0 z-10">
                    <tr>
                        <th class="p-3 border-b border-slate-700 font-bold uppercase tracking-wider">Nome Corsista</th>
                        <th class="p-3 border-b border-slate-700 font-bold uppercase tracking-wider">Corso Svolto</th>
                        <th class="p-3 border-b border-slate-700 font-bold uppercase tracking-wider text-center">Data Verifica</th>
                        <th class="p-3 border-b border-slate-700 font-black uppercase tracking-wider text-center text-red-300">Scadenza</th>
                        <th class="p-3 border-b border-slate-700 font-bold uppercase tracking-wider">Azienda</th>
                        <th class="p-3 border-b border-slate-700 font-bold uppercase tracking-wider">Contatti Azienda (Tel/Email)</th>
                    </tr>
                </thead>
                <tbody id="tabella-scadenze" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>
</div>
        </div>
    </div>
</div>
