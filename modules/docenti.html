<div id="view-docenti" class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter">Anagrafica Docenti</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Gestione dei formatori qualificati</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit sticky top-0">
            <h3 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-3 mb-4"><i data-lucide="graduation-cap" class="w-5 h-5 text-emerald-600"></i> Nuovo Docente</h3>
            
            <form id="form-docente" onsubmit="event.preventDefault(); window.salvaDocenteDB();" class="space-y-4">
                <input type="hidden" id="doc-id" value="">
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Nome e Cognome *</label>
                    <input type="text" id="doc-nome" required class="input-field font-bold text-emerald-900" placeholder="Es. Mario Rossi">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Codice Fiscale *</label>
                    <input type="text" id="doc-cf" required class="input-field font-mono uppercase" placeholder="RSSMRA80A01H501Z">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Qualifica Formatore *</label>
                    <select id="doc-qualifica" required class="input-field text-xs bg-slate-50">
                        <option value="Formatore Qualificato (D.I. 6/3/2013)">Formatore Qualificato (D.I. 6/3/2013)</option>
                        <option value="Datore di Lavoro / RSPP (Art. 34 D.Lgs 81/08)">Datore di Lavoro / RSPP (Art. 34 D.Lgs 81/08)</option>
                        <option value="Docente Tecnico (Medico, Ingegnere, ecc.)">Docente Tecnico (Medico, Ingegnere, ecc.)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Azienda di appartenenza</label>
                    <input type="text" id="doc-azienda-appartenenza" class="input-field text-sm" placeholder="Es. CNA Avellino / Azienda / Studio professionale">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Email</label>
                        <input type="email" id="doc-email" class="input-field text-xs" placeholder="mario.rossi@email.it">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Telefono</label>
                        <input type="text" id="doc-telefono" class="input-field text-xs" placeholder="333 1234567">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex gap-2">
                    <button type="button" onclick="window.resetFormDocente()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold transition">Annulla</button>
                    <button type="submit" class="flex-[2] bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition shadow">
                        <i data-lucide="save" class="w-4 h-4"></i> Salva Docente
                    </button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-emerald-600"></i> Database Docenti</h3>
                <input type="text" id="search-docenti" oninput="window.filtraDocenti()" placeholder="Cerca docente..." class="px-3 py-1.5 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Nome Cognome</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">C.F.</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Qualifica</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Azienda appartenenza</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider text-center">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-docenti" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-6 text-center text-slate-400 italic">Caricamento in corso...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
