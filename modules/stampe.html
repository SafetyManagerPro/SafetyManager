<!-- modules/stampe.html -->
<img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" class="hidden" onload="window.loadOptionalSafetyScript && window.loadOptionalSafetyScript('js/modules/centro_stampe_direct.js')">
<div class="w-full max-w-7xl mx-auto mt-4 mb-10 flex flex-col lg:flex-row gap-6 relative">
    
    <!-- PANNELLO LATERALE COMANDI -->
    <div class="w-full lg:w-80 shrink-0">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky top-24">
            <h2 class="font-black text-sm uppercase text-slate-800 mb-4 border-b border-slate-100 pb-2 flex items-center gap-2">
                <i data-lucide="printer" class="w-4 h-4 text-indigo-500"></i> Centro Stampe
            </h2>
            
            <!-- FILTRO CORSI PER L'AREA STAMPE -->
            <div class="mb-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">1. Filtra per Tipologia Corso</label>
                <select id="filter-stampe-corso" onchange="window.filtraStampe()" class="w-full px-3 py-2 bg-white border border-slate-300 rounded outline-none focus:border-indigo-500 transition font-bold text-slate-700 text-xs">
                    <!-- Popolato via JS -->
                </select>
            </div>

            <!-- FILTRO AZIENDA / COMMITTENTE -->
            <div class="mb-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">2. Filtra per Azienda / Committente</label>
                <select id="filter-stampe-azienda" onchange="window.filtraStampe()" class="w-full px-3 py-2 bg-white border border-slate-300 rounded outline-none focus:border-amber-500 transition font-bold text-slate-700 text-xs">
                    <option value="">-- Mostra tutte le aziende --</option>
                    <!-- Popolato via JS -->
                </select>
            </div>

            <!-- SELEZIONE PROGETTO -->
            <div class="mb-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">3. Seleziona Progetto Formativo</label>
                <select id="stampa-progetto" onchange="window.caricaDatiStampa()" class="w-full px-3 py-2 bg-indigo-50 border border-indigo-200 rounded outline-none focus:border-indigo-500 transition font-black text-indigo-900 text-xs shadow-inner">
                    <option value="">-- Seleziona un progetto --</option>
                    <!-- Popolato via JS -->
                </select>
                <p id="stampe-progetti-count" class="mt-1 text-[9px] font-bold uppercase text-slate-400">0 progetti disponibili</p>
            </div>

            <div class="space-y-2 mt-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">4. Clicca il documento: si aprirà direttamente la stampa</p>
                
                <button onclick="window.stampaDocumentoCentroStampe('progetto_formativo')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="layout-template" class="w-4 h-4 text-slate-400"></i> Progetto Formativo
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('analisi_fabbisogni')" class="w-full text-left px-4 py-2.5 bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 rounded-lg text-xs font-bold text-cyan-900 hover:border-cyan-400 transition flex items-center gap-2">
                    <i data-lucide="search-check" class="w-4 h-4 text-cyan-700"></i> Analisi Fabbisogni Formativi
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('scheda_rischi_settore')" class="w-full text-left px-4 py-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg text-xs font-bold text-amber-900 hover:border-amber-400 transition flex items-center gap-2">
                    <i data-lucide="shield-alert" class="w-4 h-4 text-amber-700"></i> Scheda Rischi per Settore
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('questionario_gradimento')" class="w-full text-left px-4 py-2.5 bg-violet-50 hover:bg-violet-100 border border-violet-200 rounded-lg text-xs font-bold text-violet-900 hover:border-violet-400 transition flex items-center gap-2">
                    <i data-lucide="message-square-heart" class="w-4 h-4 text-violet-700"></i> Questionari Gradimento Corsisti
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('riepilogo_gradimento')" class="w-full text-left px-4 py-2.5 bg-violet-50 hover:bg-violet-100 border border-violet-200 rounded-lg text-xs font-bold text-violet-900 hover:border-violet-400 transition flex items-center gap-2">
                    <i data-lucide="chart-no-axes-combined" class="w-4 h-4 text-violet-700"></i> Riepilogo Gradimento
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('monitoraggio_qualita')" class="w-full text-left px-4 py-2.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-xs font-bold text-emerald-900 hover:border-emerald-400 transition flex items-center gap-2">
                    <i data-lucide="list-checks" class="w-4 h-4 text-emerald-700"></i> Monitoraggio Qualità
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('verifica_efficacia')" class="w-full text-left px-4 py-2.5 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg text-xs font-bold text-indigo-900 hover:border-indigo-400 transition flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4 text-indigo-700"></i> Verifica Efficacia Post-Formazione
                </button>

                <button id="btn-print-relazione-tutor" onclick="window.stampaDocumentoCentroStampe('relazione_tutor')" class="w-full text-left px-4 py-2.5 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-lg text-xs font-bold text-sky-900 hover:border-sky-400 transition flex items-center gap-2">
                    <i data-lucide="clipboard-pen-line" class="w-4 h-4 text-sky-700"></i> Relazione Finale Tutor
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('scheda_riesame')" class="w-full text-left px-4 py-2.5 bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-lg text-xs font-bold text-orange-900 hover:border-orange-400 transition flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-orange-700"></i> Scheda Riesame e Miglioramento
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('test_lingua_italiana')" class="w-full text-left px-4 py-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 rounded-lg text-xs font-bold text-amber-950 hover:border-amber-500 transition flex items-center gap-2">
                    <i data-lucide="languages" class="w-4 h-4 text-amber-700"></i> Test Comprensione Lingua Italiana
                </button>
                <button onclick="window.stampaDocumentoCentroStampe('informativa_privacy')" class="w-full text-left px-4 py-2.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg text-xs font-bold text-blue-900 hover:border-blue-400 transition flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4 text-blue-700"></i> Informativa Privacy + Presa Visione
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('validazione_percorso_formativo')" class="w-full text-left px-4 py-2.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-xs font-bold text-emerald-800 hover:text-emerald-900 hover:border-emerald-300 transition flex items-center gap-2">
                    <i data-lucide="badge-check" class="w-4 h-4 text-emerald-600"></i> Validazione CNA / Comunicazione OPRA-OPTA
                </button>

                <button id="btn-print-dichiarazioni-docenti" onclick="window.stampaDocumentoCentroStampe('dichiarazione_docenza')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="pen-tool" class="w-4 h-4 text-slate-400"></i> Requisiti Docenti (una dichiarazione per docente)
                </button>

                <button id="btn-print-autocert-ente" onclick="window.stampaDocumentoCentroStampe('autocert')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> Autocertificazione Requisiti Ente
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('richiesta_organismo_paritetico')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="send" class="w-4 h-4 text-blue-500"></i> Richiesta Organismo Paritetico
                </button>

                <!-- NUOVA DICHIARAZIONE ATTREZZATURE -->
                <button onclick="window.stampaDocumentoCentroStampe('dichiarazione_attrezzature')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="tractor" class="w-4 h-4 text-orange-500"></i> Idoneità Attrezzature Pratiche
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('registro')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-4 h-4 text-amber-500"></i> Registri Presenze · uno per giornata
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('esame')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="file-question" class="w-4 h-4 text-rose-500"></i> Scheda Test Esame
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('verbale')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="file-check-2" class="w-4 h-4 text-emerald-500"></i> Verbale Finale Esame
                </button>

                <button onclick="window.stampaDocumentoCentroStampe('fascicolo_corso')" class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 hover:text-indigo-700 hover:border-indigo-200 transition flex items-center gap-2">
                    <i data-lucide="archive" class="w-4 h-4 text-blue-500"></i> Fascicolo del Corso / Checklist Archivio
                </button>
                
                <button onclick="window.stampaDocumentoCentroStampe('attestato')" class="w-full mt-4 text-left px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-900 rounded-lg text-xs font-black text-white transition flex items-center gap-2 relative shadow-lg">
                    <i data-lucide="award" class="w-4 h-4 text-amber-400"></i> Attestati (Massiva)
                    <span class="absolute right-3 top-3 w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </button>
            </div>

            <div class="mt-8 pt-4 border-t border-slate-200">
                <button type="button" disabled class="w-full mb-3 bg-slate-100 text-slate-400 font-black uppercase py-2.5 px-4 rounded shadow-sm text-[10px] flex justify-center items-center gap-2 border border-slate-200 cursor-not-allowed" title="Modulo in pausa">
                    <i data-lucide="pause-circle" class="w-3.5 h-3.5"></i> Procedure digitali in pausa
                </button>
                <button id="btn-correttore" onclick="window.toggleCorrettore()" class="hidden w-full mb-3 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold uppercase py-2 px-4 rounded shadow-sm transition text-[10px] flex justify-center items-center gap-2 border border-amber-300">
                    <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Mostra/Nascondi Correttore
                </button>

                <button onclick="window.stampaFascicoloCompletoPDF()" class="w-full mb-3 bg-slate-900 hover:bg-slate-800 text-white font-black uppercase py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-[11px]">
                    <i data-lucide="file-archive" class="w-4 h-4"></i> PDF unico progetto + test/correttori
                </button>

                <button onclick="window.stampaSoloAttestatiPDF()" class="w-full mb-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black uppercase py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-[11px]">
                    <i data-lucide="award" class="w-4 h-4"></i> PDF solo attestati
                </button>

                <button onclick="window.stampaSezioneAttuale()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black uppercase py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="printer" class="w-5 h-5"></i> Ristampa documento visualizzato
                </button>
            </div>
        </div>
    </div>

    <!-- PREVIEW AREA -->
    <div class="flex-1 bg-slate-200 rounded-xl border border-slate-300 overflow-hidden flex justify-center p-8 min-h-[800px]">
        <div id="print-preview-container" class="shadow-2xl bg-white w-[210mm] min-h-[296mm] transform origin-top transition-all flex flex-col">
            <div class="flex items-center justify-center h-full flex-1 text-slate-400 font-bold uppercase tracking-widest text-sm flex-col gap-3 mt-40">
                <i data-lucide="file-search" class="w-12 h-12 opacity-50"></i>
                Seleziona un progetto e clicca un documento: verrà preparato e inviato direttamente alla stampa
            </div>
        </div>
    </div>
</div>
