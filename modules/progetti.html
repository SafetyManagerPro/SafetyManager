<!-- modules/progetti.html -->
<div id="view-progetti" class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter">Gestione Progetti Formativi</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Creazione corsi e iscrizione allievi</p>
    </div>

    <!-- SEZIONE 1: I PROGETTI (Corsi) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        
        <!-- FORM PROGETTO -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit">
            <h3 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-3 mb-4"><i data-lucide="layout-template" class="w-5 h-5 text-amber-500"></i> Nuovo Progetto</h3>
            
            <form id="form-progetto" onsubmit="event.preventDefault(); window.salvaProgettoDB();" class="space-y-4">
                <input type="hidden" id="prog-id" value="">
                
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Azienda Committente *</label>
                    <select id="prog-azienda" required class="input-field text-xs font-bold text-blue-900 bg-blue-50">
                        <option value="">-- Seleziona Azienda --</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Tipologia Corso *</label>
                    <select id="prog-corso" required class="input-field text-xs font-bold text-slate-800">
                        <option value="lav_basso">Formazione Lavoratori - Rischio Basso (8h)</option>
                        <option value="lav_medio">Formazione Lavoratori - Rischio Medio (12h)</option>
                        <option value="lav_alto">Formazione Lavoratori - Rischio Alto (16h)</option>
                        <option value="dl_base">Datore Lavoro / RSPP - Base (16h)</option>
                        <option value="preposto">Preposto (8h)</option>
                        <option value="dirigente">Dirigente (16h)</option>
                        <option value="antincendio_2">Antincendio - Liv. 2 (8h)</option>
                        <option value="primo_soccorso_b">Primo Soccorso - Gr. B/C (12h)</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Cod. Interno</label>
                        <input type="text" id="prog-codice" class="input-field text-xs font-mono" placeholder="Es. AZ-01-26">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Modalità</label>
                        <select id="prog-modalita" class="input-field text-xs">
                            <option value="In Presenza Fisica">Presenza</option>
                            <option value="Videoconferenza Sincrona">FAD Sincrona</option>
                            <option value="Blended (Mista)">Blended</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Data Inizio</label>
                        <input type="date" id="prog-inizio" class="input-field text-xs">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Data Esame</label>
                        <input type="date" id="prog-esame" required class="input-field text-xs border-amber-300">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Docente Principale</label>
                    <select id="prog-docente" class="input-field text-xs font-bold text-emerald-800 bg-emerald-50">
                        <option value="">-- Seleziona Docente --</option>
                    </select>
                </div>

                <div class="pt-4 border-t border-slate-100 flex gap-2">
                    <button type="button" onclick="window.resetFormProgetto()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold transition">Annulla</button>
                    <button type="submit" class="flex-[2] bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition shadow">
                        <i data-lucide="save" class="w-4 h-4"></i> Salva Progetto
                    </button>
                </div>
            </form>
        </div>

        <!-- ELENCO PROGETTI -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-amber-500"></i> Elenco Progetti</h3>
            </div>

            <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-50 text-slate-500 sticky top-0">
                        <tr>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Codice</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider">Corso & Azienda</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider text-center">Data Esame</th>
                            <th class="p-3 border-b font-bold uppercase tracking-wider text-center">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-progetti" class="divide-y divide-slate-100">
                        <tr><td colspan="4" class="p-6 text-center text-slate-400 italic">Caricamento in corso...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SEZIONE 2: GESTIONE ISCRIZIONI (Si apre cliccando su un progetto) -->
    <div id="panel-iscrizioni" class="hidden bg-slate-800 rounded-xl shadow-xl border border-slate-700 p-6">
        <div class="flex justify-between items-center border-b border-slate-600 pb-4 mb-6">
            <div>
                <h2 class="text-xl font-black text-white flex items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-blue-400"></i> Gestione Iscrizioni Allievi</h2>
                <p id="lbl-progetto-attivo" class="text-sm text-slate-400 font-bold mt-1">Seleziona un progetto...</p>
            </div>
            <button onclick="window.chiudiPannelloIscrizioni()" class="text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 p-2 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- AGGIUNGI CORSISTA -->
            <div class="bg-slate-700 p-5 rounded-lg border border-slate-600">
                <h4 class="font-bold text-white mb-3 text-sm">Iscrivi Corsista</h4>
                <select id="sel-iscrivi-corsista" class="w-full bg-slate-600 text-white border border-slate-500 rounded p-2 text-xs mb-3 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Caricamento corsisti... --</option>
                </select>
                <button onclick="window.aggiungiIscrizione()" class="w-full bg-blue-500 hover:bg-blue-400 text-white py-2 rounded-lg text-sm font-bold flex justify-center items-center gap-2 transition shadow">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Aggiungi al Corso
                </button>
            </div>

            <!-- TABELLA ISCRITTI -->
            <div class="md:col-span-2 bg-slate-700 p-5 rounded-lg border border-slate-600">
                <table class="w-full text-left text-xs border-collapse text-slate-200">
                    <thead class="bg-slate-800 text-slate-400">
                        <tr>
                            <th class="p-2 border-b border-slate-600 font-bold uppercase">Nome Corsista</th>
                            <th class="p-2 border-b border-slate-600 font-bold uppercase">C.F.</th>
                            <th class="p-2 border-b border-slate-600 font-bold uppercase">ID Certificato</th>
                            <th class="p-2 border-b border-slate-600 font-bold uppercase text-center">Rimuovi</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-iscritti" class="divide-y divide-slate-600">
                        <!-- Generato dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
