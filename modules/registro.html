<!-- modules/registro.html -->
<div class="doc-page landscape flex flex-col" style="padding: 10mm 15mm 5mm 15mm !important; max-height: 210mm;">
    
    <!-- Redesign Header -->
    <div class="flex justify-between items-center border-b border-slate-300 pb-3 shrink-0 mb-4">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-black uppercase text-slate-800 tracking-tight">Registro Presenze Allievi</h1>
        </div>
        <div class="text-right">
            <p class="text-[9px] text-slate-500 uppercase tracking-widest">Ente Erogatore</p>
            <p class="text-sm font-bold text-slate-800 val-ente">---</p>
        </div>
    </div>

    <!-- Redesign Info Grid -->
    <div class="grid grid-cols-4 gap-4 mb-4 shrink-0 px-2">
        <div class="border-l-2 border-blue-500 pl-2">
            <span class="text-[8px] uppercase text-slate-400 font-bold block mb-0.5">Cod. Progetto</span>
            <span class="val-codice font-mono font-bold text-xs text-slate-700">---</span>
        </div>
        <div class="border-l-2 border-blue-500 pl-2 col-span-2">
            <span class="text-[8px] uppercase text-slate-400 font-bold block mb-0.5">Azienda & Corso</span>
            <span class="val-azienda font-black text-xs text-slate-900 uppercase block truncate">---</span>
            <span class="val-titolo-corso text-[10px] text-blue-700 font-bold uppercase truncate block">---</span>
        </div>
        <div class="border-l-2 border-blue-500 pl-2">
            <span class="text-[8px] uppercase text-slate-400 font-bold block mb-0.5">Data Inizio / Esame</span>
            <span class="text-xs font-bold text-slate-800 block"><span class="val-data-inizio"></span> - <span class="val-data-esame text-blue-700"></span></span>
        </div>
    </div>

    <!-- Tabella (Gestita da JS per le 30 righe) -->
    <div class="flex-1 flex flex-col overflow-hidden px-1">
        <table class="table-bordered text-[8px] h-full table-fixed">
            <thead class="bg-slate-100 text-slate-700">
                <tr>
                    <th class="py-1.5 w-8 text-center uppercase tracking-wide">#</th>
                    <th class="py-1.5 px-3 w-[22%] text-left uppercase tracking-wide">Allievo / Mansione</th>
                    <th class="py-1.5 w-24 text-center uppercase tracking-wide">C.F.</th>
                    <th class="py-1.5 w-16 text-center uppercase tracking-wide">Ingresso</th>
                    <th class="py-1.5 text-center uppercase tracking-wide">Firma Ingresso</th>
                    <th class="py-1.5 w-16 text-center uppercase tracking-wide">Uscita</th>
                    <th class="py-1.5 text-center uppercase tracking-wide">Firma Uscita</th>
                </tr>
            </thead>
            <tbody id="r-rows" class="bg-white"></tbody>
        </table>
    </div>

    <div class="mt-auto shrink-0 flex flex-nowrap justify-between px-16 text-[10px] font-bold uppercase text-slate-400 text-center pt-6 pb-2">
        <div class="w-1/3">
            <div class="w-full border-t border-slate-500 mb-1.5"></div>
            <span class="text-[8px] font-bold text-slate-500 block tracking-widest">Firma Docenza</span>
        </div>
        <div class="w-1/3">
            <div class="w-full border-t border-slate-500 mb-1.5"></div>
            <span class="text-[8px] font-bold text-slate-500 block tracking-widest">Resp. Progetto</span>
            <span class="val-resp-progetto text-slate-800 font-black text-[9px] block">---</span>
        </div>
    </div>
</div>
