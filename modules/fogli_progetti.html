
<div id="view-fogli-progetti" class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter">Fogli Progetti / Corsisti</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Vista tipo Excel dei progetti formativi con relativi partecipanti</p>
    </div>

    <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-5 mb-5">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-3 items-end">
            <div class="lg:col-span-3">
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Seleziona progetto formativo</label>
                <select id="foglio-progetto-select" onchange="window.caricaFoglioProgetto(this.value)" class="w-full mt-1 px-3 py-3 bg-white border border-slate-300 rounded-xl text-xs font-bold outline-none focus:border-blue-500 shadow-sm">
                    <option value="">-- Seleziona progetto --</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="window.stampaFoglioProgetto()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest inline-flex items-center justify-center gap-2">
                    <i data-lucide="printer" class="w-4 h-4"></i> Stampa foglio
                </button>
            </div>
        </div>
    </div>

    <div id="foglio-progetto-preview" class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
        <div class="p-8 text-center text-slate-400 font-bold uppercase text-xs">Seleziona un progetto per visualizzare il foglio corsisti.</div>
    </div>
</div>
