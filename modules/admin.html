<div id="view-admin" class="doc-page multipage print-as-block max-w-5xl">

        <div>
            <h1 class="text-2xl font-black uppercase text-slate-900 tracking-tighter">Dashboard Amministrativa</h1>

    <!-- Questo div viene popolato da js/utils.js -->

        </div>
