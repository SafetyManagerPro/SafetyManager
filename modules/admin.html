<div class="w-full max-w-7xl mx-auto mt-4 mb-10">
    <div class="border-b-2 border-slate-900 pb-3 mb-6">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-tighter flex items-center gap-3">
            <i data-lucide="layout-dashboard" class="w-8 h-8 text-blue-600"></i> Dashboard
        </h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Pannello di controllo principale</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:shadow-md transition" onclick="window.loadModule('aziende')">
            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i data-lucide="briefcase"></i></div>
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase">Aziende</p>
                <p class="text-2xl font-black text-slate-800" id="dash-aziende">0</p>
            </div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:shadow-md transition" onclick="window.loadModule('corsisti')">
            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center"><i data-lucide="users"></i></div>
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase">Corsisti</p>
                <p class="text-2xl font-black text-slate-800" id="dash-corsisti">0</p>
            </div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:shadow-md transition" onclick="window.loadModule('docenti')">
            <div class="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i data-lucide="graduation-cap"></i></div>
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase">Docenti</p>
                <p class="text-2xl font-black text-slate-800" id="dash-docenti">0</p>
            </div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:shadow-md transition" onclick="window.loadModule('progetti')">
            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center"><i data-lucide="layout-template"></i></div>
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase">Progetti Formativi</p>
                <p class="text-2xl font-black text-slate-800" id="dash-progetti">0</p>
            </div>
        </div>
    </div>



<div class="grid grid-cols-1 gap-4 mb-8">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-rose-50">
            <div>
                <h2 class="font-black text-sm uppercase text-rose-900">Progetti formativi</h2>
                <p class="text-[9px] font-bold text-rose-700 uppercase tracking-widest">Raccolta errori e correzioni da effettuare</p>
            </div>
            <span id="dash-progetti-formativi-badge" class="px-2 py-1 rounded-full bg-slate-200 text-slate-700 text-[9px] font-black uppercase">Check</span>
        </div>
        <div id="dash-progetti-formativi-checks" class="p-4 text-xs text-slate-500 min-h-[180px]">
            Caricamento verifiche...
        </div>
    </div>
</div>

<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-black text-sm uppercase text-slate-800 mb-4 border-b border-slate-100 pb-2">Azioni Rapide</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <button onclick="window.loadModule('progetti')" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition text-center group">
                <i data-lucide="plus-circle" class="w-8 h-8 mx-auto mb-2 text-slate-400 group-hover:text-rose-500 transition-colors"></i>
                <span class="text-xs font-bold text-slate-700 uppercase">Nuovo Corso</span>
            </button>
            <button onclick="window.loadModule('corsisti')" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition text-center group">
                <i data-lucide="user-plus" class="w-8 h-8 mx-auto mb-2 text-slate-400 group-hover:text-emerald-500 transition-colors"></i>
                <span class="text-xs font-bold text-slate-700 uppercase">Nuovo Allievo</span>
            </button>
            <button onclick="window.loadModule('scadenze')" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition text-center group">
                <i data-lucide="bell-ring" class="w-8 h-8 mx-auto mb-2 text-slate-400 group-hover:text-red-500 transition-colors"></i>
                <span class="text-xs font-bold text-slate-700 uppercase">Vedi Scadenze</span>
            </button>
            
            <button onclick="window.loadModule('archivio_corsi')" class="p-4 border border-blue-200 bg-blue-50 rounded-lg hover:bg-blue-100 transition text-center group shadow-sm">
                <i data-lucide="folders" class="w-8 h-8 mx-auto mb-2 text-blue-500 group-hover:text-blue-600 transition-colors"></i>
                <span class="text-xs font-bold text-blue-800 uppercase">Archivio Imprese</span>
            </button>

            <button onclick="window.loadModule('migrazione')" class="p-4 border border-amber-200 bg-amber-50 rounded-lg hover:bg-amber-100 transition text-center group shadow-sm">
                <i data-lucide="database-zap" class="w-8 h-8 mx-auto mb-2 text-amber-500 group-hover:text-amber-600 transition-colors"></i>
                <span class="text-xs font-bold text-amber-800 uppercase">Migrazione Dati</span>
            </button>
        </div>
    </div>
</div>
