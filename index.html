<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyManager CRM - Cloud Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 flex flex-col min-h-screen h-screen overflow-hidden">

    <div id="print-area-temp"></div>

    <header class="no-print bg-slate-900 text-white flex-shrink-0 shadow-md z-50">
        <div class="max-w-[1500px] mx-auto px-4 py-3 flex justify-between items-center">
            
            <div class="flex items-center gap-4">
                <div class="bg-emerald-600 p-2 rounded-lg font-black tracking-widest text-lg shadow-inner flex items-center gap-2">
                    <i data-lucide="layers" class="w-5 h-5 text-emerald-100"></i> S|M CRM
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Safety Management PRO</h1>
                    <p class="text-[10px] text-emerald-300 uppercase tracking-widest">Relational Cloud Database</p>
                </div>
            </div>
            
            <div class="flex gap-1.5 bg-slate-800 p-1 rounded-xl items-center overflow-x-auto">
                
                <div onclick="window.loadModule('admin')" id="nav-admin" class="btn-tab active text-white hover:text-slate-900"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Dashboard</span></div>
                <div class="w-px bg-slate-700 h-6 mx-1"></div>
                <div onclick="window.loadModule('ente')" id="nav-ente" class="btn-tab text-white hover:text-slate-900"><i data-lucide="building-2" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Mio Ente</span></div>
                <div onclick="window.loadModule('aziende')" id="nav-aziende" class="btn-tab text-white hover:text-slate-900"><i data-lucide="briefcase" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Aziende</span></div>
                <div onclick="window.loadModule('docenti')" id="nav-docenti" class="btn-tab text-white hover:text-slate-900"><i data-lucide="graduation-cap" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Docenti</span></div>
                <div onclick="window.loadModule('corsisti')" id="nav-corsisti" class="btn-tab text-white hover:text-slate-900"><i data-lucide="users" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Corsisti</span></div>
                
                <div class="w-px bg-slate-700 h-6 mx-1"></div>
                
                <div onclick="window.loadModule('progetti')" id="nav-progetti" class="btn-tab text-amber-400 hover:text-amber-900 hover:bg-amber-100 border-amber-800/30"><i data-lucide="layout-template" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Progetti (Corsi)</span></div>
                
                <div class="w-px bg-slate-700 h-6 mx-1"></div>
                
                <div onclick="window.loadModule('stampe')" id="nav-stampe" class="btn-tab bg-blue-900 text-blue-100 hover:bg-blue-800 border-blue-700 shadow-inner px-4"><i data-lucide="printer" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Area Stampe</span></div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-[1500px] mx-auto w-full gap-6 p-4 overflow-hidden">
        <main class="flex-1 w-full relative overflow-y-auto pb-10" id="app-content">
            </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/supabase_config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
