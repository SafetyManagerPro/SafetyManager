<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyManager PRO 2025</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- STILI GRAFICI PREMIUM E GESTIONE STAMPA PDF MILLIMETRICA -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        #app-content { margin-top: 6rem; padding-bottom: 3rem; }

        /* --- Stili Pulsanti Navbar --- */
        .btn-tab { position: relative; transition: all 0.3s ease; }
        .btn-tab.active { background-color: #1e293b !important; color: #ffffff !important; }
        .btn-tab.active .icon-box.admin { background-color: #3b82f6; box-shadow: 0 0 15px rgb(59 130 246 / 0.6); }
        .btn-tab.active .icon-box.aziende { background-color: #f59e0b; box-shadow: 0 0 15px rgb(245 158 11 / 0.6); }
        .btn-tab.active .icon-box.corsisti { background-color: #10b981; box-shadow: 0 0 15px rgb(16 185 129 / 0.6); }
        .btn-tab.active .icon-box.docenti { background-color: #a855f7; box-shadow: 0 0 15px rgb(168 85 247 / 0.6); }
        .btn-tab.active .icon-box.progetti { background-color: #f43f5e; box-shadow: 0 0 15px rgb(244 63 94 / 0.6); }
        .btn-tab.active .icon-box.stampe { background-color: #6366f1; box-shadow: 0 0 15px rgb(99 102 241 / 0.6); }
        .btn-tab.active .icon-box.ente { background-color: #64748b; box-shadow: 0 0 15px rgb(100 116 139 / 0.6); }
        .btn-tab.active .icon-svg { color: #ffffff; }

        .btn-tab::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 0; height: 3px; background-color: transparent; transition: all 0.3s ease; border-radius: 4px 4px 0 0;
        }
        .btn-tab.active::after { width: 80%; }
        .btn-tab.active[id="nav-admin"]::after { background-color: #3b82f6; }
        .btn-tab.active[id="nav-aziende"]::after { background-color: #f59e0b; }
        .btn-tab.active[id="nav-corsisti"]::after { background-color: #10b981; }
        .btn-tab.active[id="nav-docenti"]::after { background-color: #a855f7; }
        .btn-tab.active[id="nav-progetti"]::after { background-color: #f43f5e; }
        .btn-tab.active[id="nav-stampe"]::after { background-color: #6366f1; }
        .btn-tab.active[id="nav-ente"]::after { background-color: #64748b; }

        /* --- MOTORE DI STAMPA PDF (Risolve Spaginazioni e Pagine Bianche) --- */
        body.is-printing-temp #print-area-temp {
            display: block !important;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            background: white;
            z-index: 99999;
        }
        body.is-printing-temp nav,
        body.is-printing-temp aside,
        body.is-printing-temp main {
            display: none !important;
        }

        @media print {
            body { background: white !important; margin: 0 !important; padding: 0 !important; }
            nav, aside, main { display: none !important; }
            #print-area-temp { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
            
            .doc-page { 
                box-sizing: border-box !important;
                box-shadow: none !important; 
                border: none !important; 
                margin: 0 auto !important; 
                width: 210mm !important; 
                height: 296mm !important; 
                max-height: 296mm !important;
                padding: 15mm !important; 
                page-break-after: always !important; 
                break-after: page !important;
                overflow: hidden !important; 
                position: relative;
            }
            
            @page { size: A4 portrait; margin: 0mm; }
            
            .landscape-force { 
                transform: rotate(-90deg) translate(-296mm, 0); 
                transform-origin: top left; 
                width: 296mm !important; 
                height: 210mm !important; 
                position: absolute; top: 0; left: 0; 
            }
            .print-show { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- NAVBAR SUPERIORE PREMIUM (GLASSMORPHISM) -->
    <nav class="w-full bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl fixed top-0 left-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- LOGO A SINISTRA -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.loadModule('admin')">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-emerald-400 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30 shrink-0">
                    <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="font-black text-2xl tracking-tighter text-white leading-none">Safety<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">PRO</span></h1>
                    <p class="text-[8px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Management System</p>
                </div>
            </div>

            <!-- BOTTONI DI NAVIGAZIONE AL CENTRO/DESTRA -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                
                <!-- BOTTONE INSTALLA WEBAPP PWA (Nascosto di default, appare solo se installabile) -->
                <button id="btn-install-app" class="hidden flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 text-emerald-400 hover:text-white hover:bg-slate-800 group mr-2 border border-emerald-500/30 bg-emerald-500/10">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/20 flex items-center justify-center group-hover:bg-emerald-500 group-hover:shadow-lg group-hover:shadow-emerald-500/40 transition-all"><i data-lucide="monitor-smartphone" class="w-3.5 h-3.5 group-hover:text-white transition-colors text-emerald-400"></i></div>
                    <span class="hidden xl:block">Installa App</span>
                </button>

                <button onclick="window.loadModule('admin')" id="nav-admin" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-blue-500 group-hover:shadow-lg group-hover:shadow-blue-500/40 transition-all icon-box admin"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Dashboard</span>
                </button>

                <button onclick="window.loadModule('aziende')" id="nav-aziende" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-amber-500 group-hover:shadow-lg group-hover:shadow-amber-500/40 transition-all icon-box aziende"><i data-lucide="briefcase" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Aziende</span>
                </button>

                <button onclick="window.loadModule('corsisti')" id="nav-corsisti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-emerald-500 group-hover:shadow-lg group-hover:shadow-emerald-500/40 transition-all icon-box corsisti"><i data-lucide="users" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Corsisti</span>
                </button>

                <button onclick="window.loadModule('docenti')" id="nav-docenti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-purple-500 group-hover:shadow-lg group-hover:shadow-purple-500/40 transition-all icon-box docenti"><i data-lucide="graduation-cap" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Docenti</span>
                </button>

                <button onclick="window.loadModule('progetti')" id="nav-progetti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-rose-500 group-hover:shadow-lg group-hover:shadow-rose-500/40 transition-all icon-box progetti"><i data-lucide="layout-template" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Progetti</span>
                </button>

                <button onclick="window.loadModule('stampe')" id="nav-stampe" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-indigo-500 group-hover:shadow-lg group-hover:shadow-indigo-500/40 transition-all icon-box stampe"><i data-lucide="printer" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Stampe</span>
                </button>

                <!-- Divisore Verticale -->
                <div class="h-6 w-px bg-slate-700 mx-1"></div>

                <button onclick="window.loadModule('ente')" id="nav-ente" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-slate-500 transition-all icon-box ente"><i data-lucide="settings" class="w-3.5 h-3.5 group-hover:rotate-90 transition-transform duration-500 group-hover:text-white icon-svg"></i></div>
                    <span class="hidden xl:block">Ente</span>
                </button>
            </div>

        </div>
    </nav>

    <!-- SPAZIO CONTENUTI -->
    <main id="app-content" class="px-4 transition-all duration-300">
        <div class="flex items-center justify-center h-64 mt-20">
            <div class="text-center text-slate-500">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4"></i>
                <p class="font-bold uppercase tracking-widest text-sm">Caricamento sistema...</p>
            </div>
        </div>
    </main>

    <!-- Area Nascosta per la Stampa PDF -->
    <div id="print-area-temp" class="hidden"></div>

    <!-- SCRIPT -->
    <script src="js/supabase_config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
