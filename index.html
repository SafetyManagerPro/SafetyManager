<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyManager PRO v14.4 - Cloud Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 flex flex-col min-h-screen h-screen overflow-hidden">

    <div id="print-area-temp"></div>

    <header class="no-print bg-slate-900 text-white flex-shrink-0 shadow-md z-50">
        <div class="max-w-[1500px] mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg font-black tracking-widest text-lg shadow-inner flex items-center gap-2">
                    <i data-lucide="cloud" class="w-5 h-5 text-blue-200"></i> S|M Cloud
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Safety Management PRO</h1>
                    <p class="text-[10px] text-blue-300 uppercase tracking-widest">Powered by Supabase</p>
                </div>
            </div>
            
            <div class="flex gap-1.5 bg-slate-800 p-1 rounded-xl items-center overflow-x-auto">
                <div onclick="window.loadModule('config')" id="nav-config" class="btn-tab active text-white hover:text-slate-900"><i data-lucide="settings" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Setup</span></div>
                <div onclick="window.loadModule('admin')" id="nav-admin" class="btn-tab text-emerald-400 hover:bg-emerald-100"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Dashboard</span></div>
                <div onclick="window.loadModule('progetto')" id="nav-progetto" class="btn-tab text-white"><i data-lucide="layout-template" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Progetto</span></div>
                <div onclick="window.loadModule('registro')" id="nav-registro" class="btn-tab text-white"><i data-lucide="users" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Reg. Allievi</span></div>
                <div onclick="window.loadModule('attestato')" id="nav-attestato" class="btn-tab text-white"><i data-lucide="award" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Attestati</span></div>
                
                <div class="w-px bg-slate-700 h-8 mx-1"></div>
                <div onclick="window.forzaAggiornamento()" class="btn-tab bg-indigo-600 text-white"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Aggiorna</span></div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-[1500px] mx-auto w-full gap-6 p-4 overflow-hidden">
        
        <main class="flex-1 w-full relative overflow-y-auto pb-10" id="app-content">
            </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/supabase_config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <!-- Modale Archivio -->
<div id="archivio-modal" class="no-print fixed inset-0 bg-slate-900/60 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
    <div id="archivio-modal-box" class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col transition-all duration-300 overflow-hidden">
        <div class="p-4 border-b flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="database" class="w-5 h-5 text-blue-600"></i> Archivio Corsisti (Cloud)
            </h2>
            <div class="flex-1 w-full max-w-md mx-4">
                <input type="text" id="search-archivio" oninput="window.filtraArchivio()" placeholder="Cerca per nome, azienda o corso..." class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg outline-none shadow-sm">
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.toggleMaximizeArchivio()" class="p-2 text-slate-500 hover:bg-blue-100 rounded-lg"><i data-lucide="maximize" id="icon-maximize" class="w-5 h-5"></i></button>
                <button onclick="window.chiudiArchivio()" class="p-2 text-slate-500 hover:bg-red-100 hover:text-red-600 rounded-lg"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
        </div>
        <div class="flex-1 overflow-auto bg-slate-50/50 p-4">
            <table class="w-full text-xs text-left bg-white shadow-sm rounded-lg overflow-hidden border-collapse">
                <thead class="sticky top-0 bg-slate-100 shadow-sm z-10">
                    <tr><th class="p-3 border-b">ID Certificato</th><th class="p-3 border-b">Corsista</th><th class="p-3 border-b">C.F.</th><th class="p-3 border-b">Azienda</th><th class="p-3 border-b">Corso</th><th class="p-3 border-b">Data</th><th class="p-3 border-b text-center">Azioni</th></tr>
                </thead>
                <tbody id="archivio-rows" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modale Sessioni -->
<div id="sessioni-modal" class="no-print fixed inset-0 bg-slate-900/60 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
    <div id="sessioni-modal-box" class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col transition-all duration-300 overflow-hidden">
        <div class="p-4 border-b flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="folders" class="w-5 h-5 text-blue-600"></i> Gestione Corsi / Sessioni
            </h2>
            <div class="flex-1 w-full max-w-md mx-4">
                <input type="text" id="search-sessioni" oninput="window.filtraSessioni()" placeholder="Cerca per codice, azienda o corso..." class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg outline-none shadow-sm">
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.chiudiSessioni()" class="p-2 text-slate-500 hover:bg-red-100 hover:text-red-600 rounded-lg"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
        </div>
        <div class="flex-1 overflow-auto bg-slate-50/50 p-4">
            <table class="w-full text-xs text-left border-collapse bg-white shadow-sm rounded-lg overflow-hidden">
                <thead class="sticky top-0 bg-slate-100 shadow-sm z-10">
                    <tr><th class="p-3 border-b">Codice Progetto</th><th class="p-3 border-b">Azienda / Corso</th><th class="p-3 border-b text-center">Inizio</th><th class="p-3 border-b text-center">Esame</th><th class="p-3 border-b text-center">N. Corsisti</th><th class="p-3 border-b text-center">Azioni</th></tr>
                </thead>
                <tbody id="sessioni-rows" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
