<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyManager PRO 2025</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        #app-content { margin-top: var(--nav-offset, 6rem); padding-bottom: 3rem; }
        #top-nav { overflow: visible !important; }
        #top-nav-inner { min-height: 5rem; height: auto !important; }
        #top-nav-buttons { overflow: visible !important; flex-wrap: wrap !important; row-gap: 0.35rem; justify-content: flex-end; }
        #top-nav .btn-tab { flex: 0 1 auto; }
        @media (max-width: 1280px) {
            #top-nav-inner { align-items: flex-start !important; padding-top: 0.75rem; padding-bottom: 0.75rem; }
            #top-nav-brand { align-self: flex-start; margin-top: 0.25rem; }
            #top-nav-buttons { max-width: calc(100vw - 260px); }
            #top-nav .btn-tab { padding: 0.45rem 0.55rem !important; }
            #top-nav .btn-tab span { display: none !important; }
        }
        @media (max-width: 768px) {
            #top-nav-inner { flex-direction: column !important; align-items: stretch !important; gap: 0.6rem; }
            #top-nav-buttons { max-width: 100%; justify-content: center; }
            #top-nav-brand { justify-content: center; }
        }

        /* --- Stili Pulsanti Navbar --- */
        .btn-tab { position: relative; transition: all 0.3s ease; }
        .btn-tab.active { background-color: #1e293b !important; color: #ffffff !important; }
        .btn-tab.active .icon-box.admin { background-color: #3b82f6; box-shadow: 0 0 15px rgb(59 130 246 / 0.6); }
        .btn-tab.active .icon-box.aziende { background-color: #f59e0b; box-shadow: 0 0 15px rgb(245 158 11 / 0.6); }
        .btn-tab.active .icon-box.corsisti { background-color: #10b981; box-shadow: 0 0 15px rgb(16 185 129 / 0.6); }
        .btn-tab.active .icon-box.docenti { background-color: #a855f7; box-shadow: 0 0 15px rgb(168 85 247 / 0.6); }
        .btn-tab.active .icon-box.progetti { background-color: #f43f5e; box-shadow: 0 0 15px rgb(244 63 94 / 0.6); }
        .btn-tab.active .icon-box.scadenze { background-color: #ef4444; box-shadow: 0 0 15px rgb(239 68 68 / 0.6); }
        .btn-tab.active .icon-box.stampe { background-color: #6366f1; box-shadow: 0 0 15px rgb(99 102 241 / 0.6); }
        .btn-tab.active .icon-box.procedure { background-color: #14b8a6; box-shadow: 0 0 15px rgb(20 184 166 / 0.6); }
        .btn-tab.active .icon-box.archivio_corsi { background-color: #2563eb; box-shadow: 0 0 15px rgb(37 99 235 / 0.6); }
        .btn-tab.active .icon-box.ente { background-color: #64748b; box-shadow: 0 0 15px rgb(100 116 139 / 0.6); }
        .btn-tab.active .icon-box.migrazione { background-color: #d97706; box-shadow: 0 0 15px rgb(217 119 6 / 0.6); }
        .btn-tab.active .icon-svg { color: #ffffff; }

        .btn-tab::after {
            content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
            width: 0; height: 3px; background-color: transparent; transition: all 0.3s ease; border-radius: 4px 4px 0 0;
        }
        .btn-tab.active::after { width: 80%; }
        .btn-tab.active[id="nav-admin"]::after { background-color: #3b82f6; }
        .btn-tab.active[id="nav-aziende"]::after { background-color: #f59e0b; }
        .btn-tab.active[id="nav-corsisti"]::after { background-color: #10b981; }
        .btn-tab.active[id="nav-docenti"]::after { background-color: #a855f7; }
        .btn-tab.active[id="nav-progetti"]::after { background-color: #f43f5e; }
        .btn-tab.active[id="nav-scadenze"]::after { background-color: #ef4444; }
        .btn-tab.active[id="nav-stampe"]::after { background-color: #6366f1; }
        .btn-tab.active[id="nav-procedure"]::after { background-color: #14b8a6; }
        .btn-tab.active[id="nav-archivio_corsi"]::after { background-color: #2563eb; }
        .btn-tab.active[id="nav-ente"]::after { background-color: #64748b; }
        .btn-tab.active[id="nav-migrazione"]::after { background-color: #d97706; }


/* Popup iscritti responsive */
#panel-iscrizioni { overflow: hidden !important; }
#iscritti-modal-card { max-width: min(980px, calc(100vw - 1rem)); }
@media (max-width: 640px) {
    #panel-iscrizioni { padding: 0.5rem !important; }
    #iscritti-modal-card { height: 86vh !important; max-height: 86vh !important; border-radius: 1rem !important; }
    #panel-iscrizioni #table-iscritti thead { display: none !important; }
    #panel-iscrizioni #table-iscritti,
    #panel-iscrizioni #table-iscritti tbody,
    #panel-iscrizioni #table-iscritti tr,
    #panel-iscrizioni #table-iscritti td { display: block !important; width: 100% !important; }
    #panel-iscrizioni #table-iscritti tr {
        margin: 0.75rem;
        border: 1px solid rgb(51 65 85);
        border-radius: 0.9rem;
        background: rgb(15 23 42 / 0.72);
        overflow: hidden;
    }
    #panel-iscrizioni #table-iscritti td {
        border-bottom: 1px solid rgb(51 65 85) !important;
        display: flex !important;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
        text-align: right !important;
        word-break: break-word;
    }
    #panel-iscrizioni #table-iscritti td::before {
        content: attr(data-label);
        color: rgb(148 163 184);
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: .08em;
        text-align: left;
        min-width: 88px;
    }
    #panel-iscrizioni #table-iscritti td:last-child { border-bottom: none !important; }
}

        /* --- MOTORE DI STAMPA PDF --- */
        body.is-printing-temp #print-area-temp { display: block !important; position: absolute; top: 0; left: 0; width: 100%; background: white; z-index: 99999; }
        body.is-printing-temp nav, body.is-printing-temp aside, body.is-printing-temp main { display: none !important; }

        @media print {
            body { background: white !important; margin: 0 !important; padding: 0 !important; }
            nav, aside, main { display: none !important; }
            #print-area-temp { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
            .doc-page { 
                box-sizing: border-box !important; box-shadow: none !important; border: none !important; 
                margin: 0 auto !important; width: 210mm !important; height: 296mm !important; 
                max-height: 296mm !important; padding: 15mm !important; 
                page-break-after: always !important; break-after: page !important; overflow: hidden !important; position: relative;
            }

/* Fix specifico attestato: evita sforamento del corpo nel bordo in stampa */
.attestato-front, .attestato-retro {
    padding: 7mm !important;
    height: 296mm !important;
    max-height: 296mm !important;
    overflow: hidden !important;
}
.attestato-front * {
    line-height: 1.15;
}
.attestato-retro .val-syllabus-table td {
    padding: 1.2mm !important;
    font-size: 6.4px !important;
    line-height: 1.12 !important;
}
.attestato-retro .val-syllabus-table ul,
.attestato-retro .val-syllabus-table li {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    line-height: 1.12 !important;
}
            @page { size: A4 portrait; margin: 0mm; }
            .landscape-force { transform: rotate(-90deg) translate(-296mm, 0); transform-origin: top left; width: 296mm !important; height: 210mm !important; position: absolute; top: 0; left: 0; }
            .print-show { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav id="top-nav" class="w-full bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl fixed top-0 left-0 z-50">
        <div id="top-nav-inner" class="max-w-[1400px] mx-auto px-4 md:px-6 min-h-20 flex items-center justify-between gap-4 flex-wrap">
            
            <div id="top-nav-brand" class="flex items-center gap-3 cursor-pointer shrink-0" onclick="window.loadModule('admin')">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-emerald-400 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30 shrink-0">
                    <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="font-black text-2xl tracking-tighter text-white leading-none">Safety<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">PRO</span></h1>
                    <p class="text-[8px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Management System</p>
                </div>
            </div>

            <div id="top-nav-buttons" class="flex items-center gap-1.5 flex-wrap justify-end overflow-visible min-w-0">
                <button id="btn-install-app" class="hidden flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 text-emerald-400 hover:text-white hover:bg-slate-800 group mr-2 border border-emerald-500/30 bg-emerald-500/10">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/20 flex items-center justify-center group-hover:bg-emerald-500 group-hover:shadow-lg group-hover:shadow-emerald-500/40 transition-all"><i data-lucide="monitor-smartphone" class="w-3.5 h-3.5 group-hover:text-white transition-colors text-emerald-400"></i></div>
                    <span class="hidden xl:block">Installa App</span>
                </button>

                <button onclick="window.loadModule('admin')" id="nav-admin" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-blue-500 transition-all icon-box admin"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Dashboard</span>
                </button>

                <button onclick="window.loadModule('aziende')" id="nav-aziende" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-amber-500 transition-all icon-box aziende"><i data-lucide="briefcase" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Aziende</span>
                </button>

                <button onclick="window.loadModule('corsisti')" id="nav-corsisti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-emerald-500 transition-all icon-box corsisti"><i data-lucide="users" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Corsisti</span>
                </button>

                <button onclick="window.loadModule('docenti')" id="nav-docenti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-purple-500 transition-all icon-box docenti"><i data-lucide="graduation-cap" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Docenti</span>
                </button>

                <button onclick="window.loadModule('progetti')" id="nav-progetti" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-rose-500 transition-all icon-box progetti"><i data-lucide="layout-template" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Progetti</span>
                </button>

                <button onclick="window.loadModule('archivio_corsi')" id="nav-archivio_corsi" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-blue-600 transition-all icon-box archivio_corsi"><i data-lucide="folders" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Archivio</span>
                </button>

                <button onclick="window.loadModule('scadenze')" id="nav-scadenze" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-red-500 transition-all icon-box scadenze"><i data-lucide="bell-ring" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Scadenze</span>
                </button>

                <button onclick="window.loadModule('stampe')" id="nav-stampe" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-indigo-500 transition-all icon-box stampe"><i data-lucide="printer" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Stampe</span>
                </button>

                <button onclick="window.loadModule('procedure')" id="nav-procedure" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 group text-slate-500 opacity-60 cursor-not-allowed border border-slate-700/60" title="Procedure digitali temporaneamente in pausa">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center icon-box procedure"><i data-lucide="pause-circle" class="w-3.5 h-3.5 icon-svg transition-colors text-slate-500"></i></div>
                    <span class="hidden xl:block">Procedure in pausa</span>
                </button>

                <div class="h-6 w-px bg-slate-700 mx-1"></div>

                <button onclick="window.loadModule('migrazione')" id="nav-migrazione" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-amber-600 transition-all icon-box migrazione"><i data-lucide="database-zap" class="w-3.5 h-3.5 group-hover:text-white icon-svg transition-colors"></i></div>
                    <span class="hidden xl:block">Migrazione</span>
                </button>

                <button onclick="window.loadModule('ente')" id="nav-ente" class="btn-tab flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-xs transition-all duration-300 hover:text-white hover:bg-slate-800 group text-slate-400">
                    <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-slate-500 transition-all icon-box ente"><i data-lucide="settings" class="w-3.5 h-3.5 group-hover:rotate-90 transition-transform duration-500 group-hover:text-white icon-svg"></i></div>
                </button>
            </div>

        </div>
    </nav>

    <main id="app-content" class="px-4 transition-all duration-300">
        <div class="flex items-center justify-center h-64 mt-20">
            <div class="text-center text-slate-500">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4"></i>
                <p class="font-bold uppercase tracking-widest text-sm">Caricamento sistema...</p>
            </div>
        </div>
    </main>

    <div id="print-area-temp" class="hidden"></div>

    <script src="js/supabase_config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/digital.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
