<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyManager PRO v14.4 - Cloud Edition</title>
    
    <!-- Librerie Esterne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- CSS Esterno -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 flex flex-col min-h-screen h-screen overflow-hidden">

    <div id="print-area-temp"></div>

    <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="window.importaJSON(event)">
    <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="window.gestisciImportazioneCSV(event)">

    <header class="no-print bg-slate-900 text-white flex-shrink-0 shadow-md z-50">
        <div class="max-w-[1500px] mx-auto px-4 py-3 flex justify-between items-center">
            
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg font-black tracking-widest text-lg shadow-inner flex items-center gap-2">
                    <i data-lucide="cloud" class="w-5 h-5 text-blue-200"></i> S|M Cloud
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Safety Management PRO</h1>
                    <p class="text-[10px] text-blue-300 uppercase tracking-widest" id="app-status-badge">App Modulare - Supabase DB</p>
                </div>
            </div>
            
            <div class="flex gap-1.5 bg-slate-800 p-1 rounded-xl items-center overflow-x-auto">
                <div onclick="window.loadModule('config')" id="nav-config" class="btn-tab active text-white hover:text-slate-900"><i data-lucide="settings" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Setup</span></div>
                <div onclick="window.loadModule('admin')" id="nav-admin" class="btn-tab text-emerald-400 hover:text-emerald-900 hover:bg-emerald-100 border-emerald-800/30"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Dashboard</span></div>
                <div onclick="window.loadModule('progetto')" id="nav-progetto" class="btn-tab text-white hover:text-slate-900"><i data-lucide="layout-template" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Progetto</span></div>
                <div onclick="window.loadModule('registro')" id="nav-registro" class="btn-tab text-white hover:text-slate-900"><i data-lucide="users" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Reg. Allievi</span></div>
                <div onclick="window.loadModule('regdocenti')" id="nav-regdocenti" class="btn-tab text-white hover:text-slate-900"><i data-lucide="user-check" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Reg. Docenti</span></div>
                <div onclick="window.loadModule('esame')" id="nav-esame" class="btn-tab text-white hover:text-slate-900"><i data-lucide="file-question" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Esame/Test</span></div>
                <div onclick="window.loadModule('verbale')" id="nav-verbale" class="btn-tab text-white hover:text-slate-900"><i data-lucide="clipboard-check" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Verbale</span></div>
                <div onclick="window.loadModule('attestato')" id="nav-attestato" class="btn-tab text-white hover:text-slate-900"><i data-lucide="award" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Attestato</span></div>
                <div onclick="window.loadModule('autocert')" id="nav-autocert" class="btn-tab text-amber-400 hover:text-amber-900 hover:bg-amber-100 border-amber-800/30"><i data-lucide="scale" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Autocert.</span></div>
                
                <div class="w-px bg-slate-700 h-8 mx-1"></div>
                
                <div onclick="window.forzaAggiornamento()" id="btn-aggiorna" class="btn-tab bg-indigo-600 text-white hover:bg-indigo-500 border-indigo-500 shadow"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Aggiorna</span></div>
                <div onclick="window.stampaSezioneAttuale()" class="btn-tab bg-blue-600 text-white hover:bg-blue-500 border-blue-500 shadow ml-1"><i data-lucide="printer" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Print View</span></div>
                <div onclick="window.stampaSoloAttestato()" class="btn-tab bg-purple-600 text-white hover:bg-purple-500 border-purple-500 shadow ml-1"><i data-lucide="award" class="w-4 h-4"></i><span class="text-[8px] font-bold mt-1">Print Certs</span></div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-[1500px] mx-auto w-full gap-6 p-4 overflow-hidden">
        <!-- Main Content Area a larghezza intera -->
        <main class="flex-1 w-full relative overflow-y-auto pb-10" id="app-content">
            <!-- Il contenuto viene iniettato dinamicamente -->
        </main>
    </div>

    <!-- MODALI (Archivio e Sessioni) -->
    <!-- [MANTIENI QUI I DIV DEI MODALI ESATTAMENTE COME LI AVEVAMO FATTI] -->

    <script src="js/data.js"></script>
    <script src="js/supabase_config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
